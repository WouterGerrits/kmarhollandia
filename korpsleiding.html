<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korpsleiding - Koninklijke Marechaussee</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Specifieke styling voor korpsleiding vakjes */
    .korps-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .korps-card {
      background-color: #e0e0e0;
      flex: 1 1 250px; /* min 250px, groeit gelijkmatig */
      max-width: 300px;
      text-align: center;
      padding: 1rem;
      border-radius: 12px;
    }
    .korps-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 0.8rem;
      border: 3px solid #004080;
    }
    .korps-card h3 {
      margin: 0.3rem 0;
      font-size: 1.2rem;
      color: #004080;
    }
    .korps-card p {
      margin: 0;
      font-weight: bold;
    }

    /* Mobile responsiveness */
    @media (max-width: 700px) {
      .korps-card {
        flex: 1 1 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
<header class="site-header">
  <h1>Korpsleiding</h1> <!-- of andere titel zoals Roepnummers -->
  <nav>
    <a href="index.html">Home</a>
    <a href="handleiding.html">Handleiding</a>
    <a href="roepnummers.html">Roepnummers</a>
    <a href="korpsleiding.html">Korpsleiding</a>
    <a href="fotos.html">Foto’s</a>
  </nav>
</header>

<main>
  <!-- Inhoud van de pagina, zoals iframe voor handleiding -->
</main>

  <main>
    <div class="korps-container">
      <!-- Eerste leider -->
      <div class="korps-card">
        <img src="images/kmarlogo.png" alt="Jack Lauren">
        <h3>Jack Lauren</h3>
        <p>Roepnummer: 71-01</p>
      </div>

      <!-- Tweede leider -->
      <div class="korps-card">
        <img src="images/kmarlogo.png" alt="Wouter Gerrits">
        <h3>Wouter Gerrits</h3>
        <p>Roepnummer: 71-02</p>
      </div>

      <!-- Derde leider -->
      <div class="korps-card">
        <img src="images/kmarlogo.png" alt="Delano">
        <h3>Delano</h3>
        <p>Roepnummer: 71-03</p>
      </div>
    </div>
  </main>
</body>
</html>
