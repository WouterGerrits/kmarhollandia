<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f6fa;
  }

  /* Login box */
.login-container {
  background: #ffffff;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);

  width: 90%;              /* geen 100% meer */
  max-width: 380px;        /* iets kleiner */
  
  text-align: center;
  margin: 2rem auto;

  box-sizing: border-box;  /* belangrijk */
}

  .login-container h1 {
    color: #004080;
    margin-bottom: 1.5rem;
  }

  .login-container input,
  .login-container select {
    width: 100%;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-sizing: border-box;
  }

  .login-container button {
    width: 100%;
    padding: 0.75rem;
    background-color: #004080;
    color: white;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
  }

  .login-container button:hover {
    background-color: #002f5f;
  }

  .error {
    color: red;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }

  
</style>
</head>
<body>

<header class="site-header">
  <h1>Inloggen</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="korpsleiding.html">Korpsleiding</a>
    <a href="fotos.html">Foto’s</a>
    <a href="wetboek.html">Wetboek</a>
    <a href="rangstructuur.html">Rangstructuur</a>
    <a href="dreigingsniveau.html">Dreigingsniveau</a>
    <a href="overons.html">Over Ons</a>
    <a href="login.html">Inloggen</a>
  </nav>
</header>

<div class="login-container">
  <h1>Login</h1>
  <div class="error" id="errorMsg"></div>
  <input type="text" id="username" placeholder="Gebruikersnaam">
  <input type="password" id="password" placeholder="Wachtwoord">
  <select id="role">
    <option value="korpsleiding">Korpsleiding</option>
    <option value="agent">KMAR Agent</option>
  </select>
  <button onclick="login()">Inloggen</button>
</div>

<script>
function login() {
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  const role = document.getElementById('role').value;

  // Voorbeeld accounts
  if(user === "luitenantgeneraal" && pass === "Kmarhrb2103!" && role === "korpsleiding") {
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("role", "korpsleiding");
    window.location.href = "dossiers.html";
  } else if(user === "kmaragent1" && pass === "Kmar2026!" && role === "agent") {
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("role", "agent");
    window.location.href = "dossiers.html";
  } else {
    document.getElementById('errorMsg').innerText = "Ongeldige gebruikersnaam, wachtwoord of rol!";
  }
}
</script>

</body>
</html>
